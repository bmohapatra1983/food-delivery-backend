spring.application.name=food-delivery-backend
#DataSource Properties
spring.datasource.url=jdbc:mysql://localhost:3306/food_delivery_db
spring.datasource.username=root
spring.datasource.password=root@mysql
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Allow application to start without database
#spring.jpa.defer-datasource-initialization=true

# JWT Configuration
app.jwt.secret=your_secret_key_should_be_at_least_32_characters_long_change_it_in_production
app.jwt.expiration=86400
app.jwt.refreshExpiration=86400
